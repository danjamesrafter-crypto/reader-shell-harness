<!--
  Reader Shell, live-data harness 0.6.0. Runs as a Flywheel extension app (Viewer type).
  UI: Flywheel Vision Design System (vision-react bundle, dark theme), mounted with React 18.

/* ---- fix: ToolbarComboButton overflow chevron ----
   The ported Popover wraps its trigger in a position:relative span, so the absolutely positioned
   .fw-toolbar-combo-more chevron was placed beside the 50px button instead of on its edge
   (the source uses Radix, which adds no wrapper). Let the wrapper cover the combo box and pass
   pointer events through to the button beneath it; only the chevron and the open list stay clickable. */
.fw-toolbar-combo > .fw-popover-wrap { position: absolute; inset: 0; display: block; pointer-events: none; }
.fw-toolbar-combo > .fw-popover-wrap > span { display: contents; }
.fw-toolbar-combo > .fw-popover-wrap .fw-toolbar-combo-more,
.fw-toolbar-combo > .fw-popover-wrap .fw-popover { pointer-events: auto; }

/* ---- ToolbarComboButton menu control (Figma Viewer-3.0 · Menu Control, 104472-110998) ----
   The side trigger is a 10×40 strip centred on the 50px button, not a full-height 10×50 one. At rest the
   16px chevron sits 2px toward the button; on hover it slides to centre (50ms) over a vertical gradient
   that peaks at the middle, with a hairline on the button side. A selected (Focused) button uses the
   denser gradient. Chevron ink: typography-light at rest, typography-base on hover; sidebar-base (fixed navy) on a selected button. */
.fw-toolbar-combo-more-left, .fw-toolbar-combo-more-right { top: 5px; height: 40px; width: 10px; overflow: visible; }
.fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-more-right .fw-icon { transition: transform 50ms ease-out; color: var(--typography-light); }
.fw-toolbar-combo-more-left .fw-icon { transform: translateX(2px); }
.fw-toolbar-combo-more-right .fw-icon { transform: translateX(-2px); }
.fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-more-right:hover .fw-icon { transform: translateX(0); color: var(--typography-base); }
.fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-more-right:hover {
  background: linear-gradient(180deg, rgba(118,164,252,0) 0%, rgba(118,164,252,0.15) 50%, rgba(118,164,252,0) 100%);
}
.fw-toolbar-combo-more-left:hover { border-right: 1px solid rgba(64,94,151,0.05); }
.fw-toolbar-combo-more-right:hover { border-left: 1px solid rgba(64,94,151,0.05); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right .fw-icon,
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover .fw-icon { color: var(--sidebar-base); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover {
  background: linear-gradient(180deg, rgba(91,131,206,0) 0%, rgba(91,131,206,0.8) 51.442%, rgba(91,131,206,0) 100%);
}
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover { border-right-color: rgba(30,49,84,0.05); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover { border-left-color: rgba(30,49,84,0.05); }

/* ---- Chip sizing (Figma Vision Design System · Chips, 4964-73403) ----
   Chip/Outlined is a fixed 24px: 1px border, 4px container padding, 16px icon/avatar/close, text 12px at
   line-height 1.2 with 6px side padding; the count beside the title is regular weight in typography-light
   (white at 60% on a filled chip). The port's 140% line-height + 16px min-height made the chip ~23px and the
   text sit low; compact keeps its 14px inner cap. */
.fw-chip { height: 24px; }
.fw-chip .fw-chip-inner { padding: 0 4px; height: 100%; box-sizing: border-box; gap: 0; }
.fw-chip .fw-chip-inner > .fw-icon:first-child { margin-left: 2px; }
.fw-chip .fw-chip-text { line-height: 1.2; min-height: 0; margin: 0; padding: 0 6px; }
.fw-chip .fw-chip-close { margin: 0; }
.fw-chip-text b { font-weight: 600; }
.fw-chip-on .fw-chip-text span { color: inherit; opacity: .6; }
.fw-chip-compact { height: auto; }
.fw-chip-compact .fw-chip-inner { max-height: 14px; padding: 2px; }

/* ---- Stepper knockout surface (vision-react FwStep `variant`) ----
   Each step paints a solid patch behind its number and text to hide the connector line that runs behind the row.
   The patch must match the surface the stepper sits on; `variant` picks it (page-light default, as in the source). */
.fw-step-bg-page-shaded .fw-step-content, .fw-step-bg-page-shaded .fw-step-deco { background: var(--page-shaded); border-color: var(--page-shaded); }
.fw-step-bg-card-header .fw-step-content, .fw-step-bg-card-header .fw-step-deco { background: var(--card-header); border-color: var(--card-header); }
.fw-step-bg-card-background .fw-step-content, .fw-step-bg-card-background .fw-step-deco { background: var(--card-background); border-color: var(--card-background); }
.fw-step-bg-inherit .fw-step-content, .fw-step-bg-inherit .fw-step-deco { background: transparent; border-color: transparent; }

/* ---- DateInput picker icon ----
   The native date control draws the browser's own calendar glyph. Hide it (keep it clickable so the picker still
   opens) and draw the library's calendar-schedule glyph over the same spot in primary-base. */
.fw-date .fw-input-box { position: relative; }
.fw-date input[type=date]::-webkit-calendar-picker-indicator,
.fw-date input[type=datetime-local]::-webkit-calendar-picker-indicator,
.fw-date input[type=time]::-webkit-calendar-picker-indicator { opacity: 0 !important; width: 22px; height: 22px; margin-left: .5rem; cursor: pointer; }
.fw-date .fw-input-box::after { content: "\e97d"; font-family: "Flywheel-Vision-Icons"; font-size: 22px; line-height: 1; color: var(--primary-base); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.fw-date .fw-input-box:has(input[type=time])::after { content: "\ea32"; }
.fw-date .fw-input-box:has(input:disabled)::after { color: var(--typography-disabled); }

<style>/* Reader Shell layout. Colours, type, radii and shadows are Vision tokens only; controls are Vision components. */
:root { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page-shaded); color: var(--typography-base); font-family: var(--font-sans); font-size: var(--text-base); line-height: var(--lh-base); -webkit-font-smoothing: antialiased; }
#app { height: 100%; }
html { scrollbar-color: var(--typography-light) var(--slate-hover); scrollbar-width: thin; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--slate-hover); }
::-webkit-scrollbar-thumb { background: var(--typography-light); border-radius: var(--radius-sm); border: 2px solid var(--page-shaded); }
code, .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

.shell { display: flex; height: 100vh; overflow: hidden; }
.rail { flex: none; height: 100vh; }
.rail .fw-navbar { height: 100%; }
.brand { display: flex; align-items: center; gap: var(--space-4); height: 50px; padding: 0 var(--space-5) 0 21px; border-bottom: 1px solid var(--separations-base); flex-shrink: 0; overflow: hidden; }
.rail-toggle { display: flex; justify-content: center; align-items: center; height: 34px; flex-shrink: 0; }
.brand .mark { display: flex; width: 18px; flex: none; }
.brand .mark svg { width: 18px; height: 25px; }
.brand .nm { display: flex; flex-direction: column; line-height: 120%; white-space: nowrap; }
.brand .nm b { font-size: var(--text-h4); font-weight: 500; }
.brand .nm span { font-size: var(--text-p4); color: var(--typography-light); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: auto; }
.topbar { flex-shrink: 0; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); min-height: 50px; padding: var(--space-3) var(--space-6); background: var(--card-background); border-bottom: 1px solid var(--separations-base); flex-wrap: wrap; }
.tb-left, .tb-right { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; min-width: 0; }
.tb-right { gap: var(--space-4); }
.work { display: inline-flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-5); height: 30px; border: 1px solid var(--separations-border); border-radius: var(--radius-chip); white-space: nowrap; }
.work-bar { width: 72px; }
.page { flex-shrink: 0; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); max-width: 1320px; width: 100%; }
.page.narrow { max-width: 760px; margin: 48px auto; }
.center { height: 100vh; display: grid; place-items: center; }
.stack { display: flex; flex-direction: column; gap: var(--space-6); }
.summary { display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
.inline { display: inline-flex; align-items: center; gap: var(--space-4); }
.filters-row { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.toolbar-l, .toolbar-r { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.alert-act { margin-top: var(--space-4); }
.tab-l { display: inline-flex; align-items: center; gap: var(--space-3); }
.tab-n { color: var(--typography-light); font-weight: 400; }

/* table cells */
.cell-stack { display: flex; flex-direction: column; gap: 2px; }
.fw-table .link { color: var(--primary-base); text-decoration: none; font-weight: 500; }
.fw-table .link:hover { text-decoration: underline; }
.fw-table .link:focus-visible { outline: 2px solid var(--primary-base); outline-offset: 2px; border-radius: var(--radius-xs); }
.strong { color: var(--typography-base); }
.sub { font-size: var(--text-p4); line-height: var(--lh-p4); color: var(--typography-light); }
.sub-i { color: var(--typography-light); }
.tone-red { color: var(--red-base); }
.tone-orange { color: var(--orange-base); }
.row-act { display: inline-flex; justify-content: flex-end; }
.ghosts { padding: var(--space-6); display: flex; flex-direction: column; gap: 14px; }
.ghost-row { display: flex; gap: var(--space-6); align-items: center; }

/* task panel: a 440px Vision panel docked right over a 25% overlay */
.scrim { position: fixed; inset: 0; z-index: 40; border: 0; padding: 0; margin: 0; background: var(--separations-overlay); cursor: default; animation: fade 150ms ease-out; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; z-index: 41; display: flex; box-shadow: var(--shadow-extra-large); animation: slide 250ms var(--ease-pop); }
.drawer .fw-panel { height: 100%; border-radius: 0; }
.dh { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); width: 100%; min-width: 0; }
.dh-t { display: flex; flex-direction: column; min-width: 0; }
.dh-t .fw-type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh-id { font-size: var(--text-h3); font-weight: 500; color: var(--typography-base); }
.df { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-4); width: 100%; }
.dstack { display: flex; flex-direction: column; gap: var(--space-7); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6); }
.kv-i { display: flex; flex-direction: column; gap: var(--space-2); }
.kv-v { font-size: var(--text-p2); color: var(--typography-base); }
.hist { display: flex; flex-direction: column; gap: var(--space-4); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-5); }
.tl li { display: flex; gap: var(--space-4); align-items: flex-start; }
.next { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-6); border: 1px solid var(--separations-border); border-radius: var(--radius-lg); background: var(--card-header); }
.links { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-left: calc(-1 * var(--space-4)); }
.hidden-note { padding-top: var(--space-5); border-top: 1px solid var(--separations-base); }

/* activity, resources, help */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--space-6); }
.stat { display: flex; gap: var(--space-5); align-items: flex-start; }
.res { display: flex; flex-direction: column; gap: var(--space-5); }
.res-tags { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.form { display: flex; flex-direction: column; gap: var(--space-7); }
pre.diag { white-space: pre-wrap; word-break: break-word; margin: var(--space-4) 0 0; font: var(--text-p4)/150% ui-monospace, 'SF Mono', Menlo, monospace; color: var(--typography-muted); max-height: 320px; overflow: auto; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 720px) {
  .page { padding: var(--space-5); }
  .work { display: none; }
}
</style>
</head>

        if (d === 1) return html`<span class="tone-orange">Due tomorrow</span>`;

      { key: 'status', header: 'Status', sortable: true, render: function (t) { return html`<${Tag} color=${SCOLOR[t.status] || 'slate'} title=${title(t.status)} />`; } },
      { key: 'act', header: '', align: 'right', noWrap: true, render: function (t) { return html`<div class="row-act" onClick=${function (e) { e.stopPropagation(); }}>${RowAction(t)}</div>`; } }
    ];

    return html`<div class="stack">
      <div class="summary">
        <${Typography} variant="h2">${od ? od + ' Overdue Read' + (od > 1 ? 's' : '') : 'Nothing Overdue'}<//>
        ${S.loading ? html`<span class="inline"><${ProgressSpinner} size="small" ariaLabel="Loading" /><${Typography} variant="p3" color="muted">Loading your tasks<//></span>` : null}
      </div>
      <div class="filters-row"><${Typography} variant="h5" color="muted">Focus<//><${ChipGroup}>${focusChips}<//></div>

      <${Tabs} value=${S.tab} onChange=${function (v) { set({ tab: v, focus: null, fProto: 'all' }); }}>
        <${Tab} value="mine" title=${tabLabel('Assigned To Me', c.mine.length)} />
        <${Tab} value="pool" title=${tabLabel('Available To Claim', c.pool.length)} />
        <${Tab} value="done" title=${tabLabel('Completed', c.done.length, waiting.length ? html`<${Tag} size="small" color="orange" title=${waiting.length + ' To Send'} />` : null)} />
      <//>

      ${S.tab === 'done' && waiting.length ? html`<${AlertPanel} severity="warning" title=${waiting.length + ' Completed Read' + (waiting.length > 1 ? 's Need' : ' Needs') + ' An Outcome'}
          description="Choose Move To Next Step or Hold For Review for each one. The choice is applied as a tag on the task's data.">
          <div class="alert-act"><${Button} size="small" color="orange" onClick=${function () { select(waiting[0]); }}>Start With ${waiting[0].task_id}<//></div>
        <//>` : null}

      <div class="toolbar">
        <div class="toolbar-l">
          <${TextInput} name="q" size="small" width=${220} leftIcon="search" placeholder="Task ID or protocol" value=${S.q} onChange=${function (v) { set({ q: v }); }} />
          <${Select} name="fread" size="compact" width=${150} value=${S.fRead} aria-label="Read" onChange=${function (v) { set({ fRead: v }); }}>
            <${SelectItem} value="all">All Reads<//>
            ${Object.keys(readsAvail).sort().map(function (k) { return html`<${SelectItem} key=${k} value=${k}>${readLabel(k)}<//>`; })}
          <//>
          <${Select} name="fprio" size="compact" width=${150} value=${S.fPrio} aria-label="Priority" onChange=${function (v) { set({ fPrio: v }); }}>
            <${SelectItem} value="all">All Priorities<//>
            ${['blocker', 'high', 'medium', 'low'].map(function (k) { return html`<${SelectItem} key=${k} value=${k}>${cap(k)}<//>`; })}
          <//>
          <${Select} name="fsort" size="compact" width=${170} value=${S.sortMode} aria-label="Sort" onChange=${function (v) { set({ sortMode: v, sortKey: v === 'column' ? S.sortKey : null }); }}>
            <${SelectItem} value="queue">${S.tab === 'done' ? 'Most Recent First' : 'Queue Order'}<//>
            <${SelectItem} value="newest">Newest First<//>
            <${SelectItem} value="oldest">Oldest First<//>
            ${S.sortMode === 'column' ? html`<${SelectItem} value="column">By Column<//>` : null}
          <//>
        </div>
        <div class="toolbar-r">
          ${S.focus ? html`<${Button} size="small" variant="outlined" color="slate" startIcon="close" onClick=${function () { set({ focus: null }); }}>${FOCUS[S.focus].label}<//>` : null}
          ${filtered ? html`<${Button} size="small" variant="ghost" color="slate" onClick=${function () { set({ q: '', fRead: 'all', fPrio: 'all', fProto: 'all', sortMode: 'queue', sortKey: null }); }}>Reset<//>` : null}
        </div>
      </div>

      ${Object.keys(protoCounts).length > 1 || S.fProto !== 'all' ? ProtoChips(protoCounts) : null}

      <${PanelLayout} border="all" padded=${false} height="auto" style=${{ flex: 'none' }}>
        ${S.loading && !S.tasks.length ? html`<div class="ghosts">${[0, 1, 2, 3, 4].map(function (i) { return html`<div key=${i} class="ghost-row"><${Ghost} variant="title" width="14%" /><${Ghost} variant="text" width="22%" /><${Ghost} variant="text" width="8%" /><${Ghost} variant="text" width="10%" /><${Ghost} variant="text" width="12%" /></div>`; })}</div>`
          : !list.length ? html`<${ContextLayout} size="compact" icon=${S.tab === 'done' ? 'document-status-done-checkmark' : 'tasklist-to-do-checkmark'} iconColor="slate" title="No Tasks Here"
              description=${filtered || S.focus ? 'Nothing matches the current filters.' : S.tab === 'pool' ? 'Nothing is waiting to be claimed.' : S.tab === 'done' ? 'Submitted reads appear here.' : 'Nothing is assigned to you right now.'}>
              ${filtered || S.focus ? html`<${Button} size="small" variant="outlined" color="slate" onClick=${function () { set({ q: '', fRead: 'all', fPrio: 'all', fProto: 'all', sortMode: 'queue', sortKey: null, focus: null }); }}>Clear Filters<//>` : null}<//>`
          : html`<${Table} columns=${columns} rows=${list} rowKey="_id" selected=${S.sel}
              sort=${{ key: S.sortMode === 'column' ? S.sortKey : '', dir: S.sortDir }}
              onSortChange=${function (s) { set({ sortMode: 'column', sortKey: s.key, sortDir: s.dir }); }}
              onRowClick=${function (t) { select(t); }} />`}
      <//>
      <${Typography} variant="p3" color="light">${list.length} of ${base.length} task${base.length === 1 ? '' : 's'}<//>
    </div>`;
  }

  function ProtoChips(counts) {
    var pk = Object.keys(counts).sort(), tot = 0; pk.forEach(function (k) { tot += counts[k]; });
    var chip = function (k, label, n) {
      var on = S.fProto === k;
      return html`<${Chip} key=${k + ':' + on} value=${k} title=${label} description=${String(n)} color="primary" size="compact" selected=${on} onSelect=${function () { set({ fProto: k }); }} />`;
    };
    return html`<div class="filters-row"><${Typography} variant="h5" color="muted">Protocol<//><${ChipGroup}>${chip('all', 'All Protocols', tot)}${pk.map(function (k) { return chip(k, k, counts[k]); })}<//></div>`;
  }

  function RowAction(t) {
    if (S.tab === 'pool') return html`<${Button} size="small" variant=${S.claiming === (t._id || t.id) ? 'progress' : 'outlined'} startIcon="user-checked" disabled=${!S.canWrite || !!S.claiming} onClick=${function () { claim(t); }}>Claim<//>`;
    if (S.tab === 'mine' && blocked(t)) return html`<${Tooltip} title="Opens when the other reads of this case are submitted"><span><${Tag} color="orange" icon="clock-hour-4" title="Waiting On Other Reads" /></span><//>`;
    if (S.tab === 'mine') return viewerUrl(t) ? html`<${Button} size="small" endIcon="open" onClick=${function () { openViewer(t); }}>${t.status === 'in_progress' ? 'Resume' : 'Start'}<//>` : html`<span class="sub-i">No viewer link</span>`;
    if (needsHandoff(t)) return html`<${Button} size="small" color="orange" onClick=${function () { select(t); }}>Choose Outcome...<//>`;
    if (sentAt(t)) return html`<${Tooltip} title=${'Tagged ' + sentAt(t).tags.join(', ')}><span><${Tag} color="green" icon="done-check" title=${tagLabel(sentAt(t).tags[0])} /></span><//>`;
    return html`<${Tag} color="slate" icon="lock" title="Locked" />`;
  }

  // Task details: only what the reader needs. Built from the list row (blinded columns), never from
  // GET /tasks/reader/{id}, which would bring project/subject/session labels into the browser.
  function Drawer() {
    var t = selTask();
    if (!t) return null;
    loadProtocols();
    var p = Array.isArray(S.protocols) ? S.protocols.filter(function (x) { return (x._id || x.id) === t.protocol_id; })[0] : null;
    var mine = isMine(t), d = days(t.due_date), st = t.status;
    var dueTxt = !t.due_date ? 'No due date' : d < 0 ? 'Overdue · ' + fmt(t.due_date) + ' (' + (-d) + ' day' + (d === -1 ? '' : 's') + ' late)' : d === 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : 'Due ' + fmt(t.due_date) + ' (in ' + d + ' days)';
    var dueTone = t.due_date && d < 0 ? 'tone-red' : t.due_date && d <= 1 ? 'tone-orange' : '';
    var tr = t.transitions || {};
    var steps = [['todo', 'Assigned'], ['in_progress', 'Started'], ['completed', 'Submitted and Signed']].filter(function (x) { return tr[x[0]]; })
      .map(function (x) { return { title: x[1], at: when(tr[x[0]]) }; });
    if (!steps.length && t.created) steps.push({ title: 'Created', at: when(t.created) });
    var mins = minutesOf(t);
    var own = !mine ? ownReadOfCase(t) : null;
    var act = null, why = '';
    if (!mine && own) { act = html`<${Tag} size="large" color="slate" icon="lock" title="Not Available To You" />`; why = 'You hold ' + own.task_id + ', another read of this case. Reads of one case must be independent, so a different reader takes this one.'; }
    else if (blocked(t)) { act = html`<${Tag} size="large" color="orange" icon="clock-hour-4" title="Waiting On Other Reads" />`; why = 'This read opens when the other reads of this case are submitted.'; }
    else if (!mine && open(t)) { act = html`<${Button} startIcon="user-checked" variant=${S.claiming ? 'progress' : 'solid'} disabled=${!!S.claiming} onClick=${function () { S.sel = null; claim(t); }}>Claim This Task<//>`; why = t.assignee ? 'In a staffing pool you belong to.' : 'Unassigned: no reader and no staffing pool.'; }
    else if (st === 'completed') { act = html`<${Tag} size="large" color="green" icon="lock" title="Submitted and Locked" />`; why = 'Your answers are signed. Contact the study team if something is wrong.'; }
    else if (viewerUrl(t)) act = html`<${Button} endIcon="open" onClick=${function () { openViewer(t); }}>${st === 'in_progress' ? 'Resume In Viewer' : 'Start Read In Viewer'}<//>`;
    else act = html`<span class="sub-i">No viewer link</span>`;

    var next = null;
    if (mine && st === 'completed') {
      var tg2 = targetOf(t), auto = p && p.completion_tags && p.completion_tags.length, cur = chosenTag(t);
      next = html`<section class="next">
        <${Typography} variant="h4">Next Step<//>
        ${auto ? html`<${Typography} variant="p3">This protocol tags the data automatically on submit (<code>${p.completion_tags.join(', ')}</code>).<//>` : null}
        ${!tg2 ? html`<${Typography} variant="p3">Can't tell which object this task is on, so it can't be sent from here.<//>`
          : sentAt(t) ? html`<${AlertPanel} severity="success" title="Sent" description=${'Tagged the task’s ' + sentAt(t).on + ' ' + sentAt(t).tags.join(', ') + ' · ' + when(sentAt(t).at)} />`
          : html`<${Typography} variant="p3">What happens to this read's data next? The choice is applied as a tag to this task's ${tg2.type}.<//>
              ${TagPicker(tagsFor(t), cur)}
              <${Button} fullWidth=${true} variant=${S.busy ? 'progress' : 'solid'} disabled=${S.busy || !cur} onClick=${function () { handoff([t], function () { return chosenTag(t); }); }}>${cur ? 'Confirm · ' + tagLabel(cur) : 'Choose An Outcome'}<//>`}
      </section>`;
    }

    var kv = function (k, v, tone) { return html`<div class="kv-i"><${Typography} variant="p4" color="light">${k}<//><span class=${'kv-v ' + (tone || '')}>${v}</span></div>`; };
    var header = html`<div class="dh"><div class="dh-t"><span class="mono dh-id">${t.task_id}</span>
        <${Typography} variant="p3" color="muted">${t.protocol_label}${t.protocol_version ? ' v' + t.protocol_version : ''}${t.read_number ? ' · Read ' + t.read_number : ''} · ${projectLabel(projectOf(t))}<//></div>
        <span class="drawer-close"><${IconButton} icon="close" color="slate" size="small" aria-label="Close" onClick=${function () { select(null); }} /></span></div>`;
    return html`<div>
      <button class="scrim" aria-label="Close task details" tabIndex="-1" onClick=${function () { select(null); }}></button>
      <div class="drawer" role="dialog" aria-modal="true" aria-label=${'Task ' + t.task_id}>
        <${PanelLayout} border="left" rounded=${false} header=${header} footer=${html`<div class="df">${act}</div>`}>
          <div class="dstack">
            ${why ? html`<${Typography} variant="p3">${why}<//>` : null}
            <div class="kv">
              ${kv('Status', html`<${Tag} color=${SCOLOR[st] || 'slate'} title=${title(st)} />`)}
              ${kv('Priority', t.priority ? html`<${Tag} color=${PCOLOR[t.priority] || 'slate'} title=${cap(t.priority)} />` : '—')}
              ${kv('Due', dueTxt, dueTone)}
              ${kv('Assignment', mine ? 'Assigned to you' : t.assignee ? 'Staffing pool' : 'Unassigned')}
              ${mins != null ? kv('Your Time On This Read', mins + ' min') : null}
              ${kv('Signature', p ? (p.esignature_config && p.esignature_config.required ? 'E-signature on submit' : 'No e-signature') : (Array.isArray(S.protocols) ? '—' : 'Loading...'))}
            </div>
            <div class="hist"><${Typography} variant="h4">History<//>
              <ul class="tl">${steps.map(function (s, i) { return html`<li key=${i}><${Icon} name="done-check-tracked" color="primary" size="small" decorative=${true} /><div><${Typography} variant="h5">${s.title}<//><${Typography} variant="p4" color="light">${s.at}<//></div></li>`; })}</ul>
            </div>
            ${next}
            <div class="links">
              <${Button} size="small" variant="ghost" startIcon="document-file-list-protocol" onClick=${function () { S.sel = null; go('resources'); }}>About This Protocol<//>
              <${Button} size="small" variant="ghost" startIcon="message-chat-question-support" onClick=${function () { S.sel = null; S.hTask = t.task_id; go('help'); }}>Report A Problem...<//>
            </div>
            <${Typography} variant="p4" color="light" className="hidden-note">Not shown, by design: subject, session and file names, scan dates, who created the task, and other readers' tasks or answers. The task was loaded with blinded fields only.<//>
          </div>
        <//>
      </div>
    </div>`;
  }

  // Outcome chooser (single choice), from the group's own tags.
  function TagPicker(list, cur) {
    if (list === 'loading' || list === undefined) return html`<span class="inline"><${ProgressSpinner} size="small" ariaLabel="Loading tags" /><${Typography} variant="p3" color="muted">Loading this study's tags<//></span>`;
    if (!Array.isArray(list)) return html`<${AlertPanel} severity="error" title="Tags Unavailable" description=${'Couldn’t load this study’s tags (' + list.error + ').'} />`;
    if (!list.length) return html`<${AlertPanel} severity="info" title="No Tags Defined" description="No tags are defined for this study's group yet. An admin adds them on the group." />`;
    var pick = function (v) { S.pick = S.pick || {}; S.pick[S.sel] = v; render(); };
    if (list.length > 8) {
      return html`<${Select} name="picktag" fullWidth=${true} placeholder="Choose a tag..." value=${cur || undefined} onChange=${pick}>
        ${list.map(function (x) { return html`<${SelectItem} key=${x} value=${x}>${tagLabel(x)}<//>`; })}<//>`;
    }
    var hint = { Move_to_next_step: 'Data goes on to the next phase', Hold_for_review: 'Data waits for the study team' };
    return html`<${ContainedRadioGroup} name="outcome" value=${cur || undefined} onChange=${pick}>
      ${list.map(function (x) { return html`<${ContainedRadio} key=${x} value=${x} title=${tagLabel(x)} description=${hint[x] || x} position="start" />`; })}
    <//>`;
  }

  function Queries() {
    return html`<${PanelLayout} border="all" height="auto" style=${{ flex: 'none' }}>
      <${ContextLayout} icon="chat-messages-bubble" iconColor="slate" title="No Queries"
        description="Questions from the study team about your submitted reads will appear here. The 23.0 API has no queries endpoint yet, so this page is a placeholder in the live harness." />
    <//>`;
  }

  function minutesOf(t) {
    var tr = t.transitions || {}, end = tr.completed && Date.parse(tr.completed), start = tr.in_progress ? Date.parse(tr.in_progress) : null;
    return end && start ? Math.max(1, Math.round((end - start) / 6e4)) : null;
  }
  function Stat(n, label, icon) {
    return html`<${PanelLayout} key=${label} border="all" height="auto"><div class="stat"><${Icon} name=${icon} color="primary" decorative=${true} /><div><${Typography} variant="h1">${n}<//><${Typography} variant="p3" color="muted">${label}<//></div></div><//>`;
  }
  function Activity(c) {
    var wk = Date.now() - 7 * 864e5;
    var thisWeek = c.done.filter(function (t) { var e = t.transitions && t.transitions.completed; return e && Date.parse(e) >= wk; }).length;
    var mins = c.done.map(minutesOf).filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
    var med = mins.length ? mins[Math.floor(mins.length / 2)] : null;
    var cols = [
      { key: 'task', header: 'Task', render: function (t) { return html`<a href=${'#/task/' + encodeURIComponent(t.task_id)} class="link mono" onClick=${function (e) { e.preventDefault(); e.stopPropagation(); select(t); }}>${t.task_id}</a>`; } },
      { key: 'protocol_label', header: 'Protocol' },
      { key: 'done', header: 'Completed', noWrap: true, render: function (t) { var e = t.transitions && t.transitions.completed; return e ? when(e) : '—'; } },
      { key: 'time', header: 'Time', align: 'right', render: function (t) { var m = minutesOf(t); return m != null ? m + ' min' : '—'; } }
    ];
    return html`<div class="stack">
      <${Typography} variant="p2">Your own reads only. Nobody else's numbers are shown.<//>
      <div class="grid">
        ${Stat(c.done.length, 'Reads Completed', 'document-status-done-checkmark')}
        ${Stat(thisWeek, 'Completed In The Last 7 Days', 'calendar-schedule')}
        ${Stat(med != null ? med + ' min' : '—', 'Median Time Per Read' + (med == null ? ' (needs in-progress timestamps)' : ''), 'timer-clock-style')}
        ${Stat(c.mine.length, 'Still Open', 'tasklist-to-do-checkmark')}
      </div>
      ${c.done.length ? html`<${PanelLayout} border="all" padded=${false} height="auto" style=${{ flex: 'none' }}><${Table} columns=${cols} rows=${c.done} rowKey="_id" onRowClick=${function (t) { select(t); }} /><//>` : null}
    </div>`;
  }

  function loadProtocols() {
    if (S.protocols) return;
    S.protocols = 'loading';
    api('GET', '/api/protocols', { filter: 'task_type=reader' }).then(function (r) {
      S.protocols = Array.isArray(r) ? r : (r && (r.results || r.items || r.data)) || [];
      render();
    }, function () { S.protocols = []; render(); });
  }
  function Resources(c) {
    loadProtocols();
    var intro = html`<${Typography} variant="p2">The protocols behind your tasks. Only protocols you have tasks on are listed.<//>`;
    if (S.protocols === 'loading' || !S.protocols) return html`<div class="stack">${intro}<div class="grid">${[0, 1].map(function (i) { return html`<${PanelLayout} key=${i} border="all" height="auto"><${Ghost} variant="title" width="60%" /><${Ghost} variant="text" width="90%" /><//>`; })}</div></div>`;
    var all = c.mine.concat(c.done, c.pool), used = {};
    all.forEach(function (t) { var k = t.protocol_id || t.protocol_label; used[k] = used[k] || { open: 0, done: 0 }; if (t.status === 'completed') used[k].done++; else used[k].open++; });
    var mineP = S.protocols.filter(function (p) { return used[p._id || p.id] || used[p.label]; });
    if (!mineP.length) return html`<div class="stack">${intro}<${PanelLayout} border="all" height="auto" style=${{ flex: 'none' }}><${ContextLayout} size="compact" icon="document-file-list-protocol" iconColor="slate" title="No Protocol Details" description="No protocol details are available for your tasks." /><//></div>`;
    return html`<div class="stack">${intro}<div class="grid">
      ${mineP.map(function (p) {
        var u = used[p._id || p.id] || used[p.label] || { open: 0, done: 0 };
        var es = p.esignature_config && p.esignature_config.required;
        return html`<${PanelLayout} key=${p._id || p.id || p.label} border="all" height="auto"
          header=${html`<${Typography} variant="h4">${p.label}<//><${Tag} color="slate" title=${'v' + p.version} />`}>
          <div class="res">
            <div class="res-tags"><${Tag} color=${es ? 'secondary' : 'slate'} icon=${es ? 'certificate' : undefined} title=${es ? 'E-Signature On Submit' : 'No E-Signature'} /><${Tag} color="primary" title=${u.open + ' Open'} /><${Tag} color="green" title=${u.done + ' Done'} /></div>
            <${Typography} variant="p2">${p.notes ? p.notes : html`<span class="sub-i">No reader-facing summary on this protocol yet. A summary field (requirement RS-P1) would fill this card.</span>`}<//>
          </div>
        <//>`;
      })}
    </div></div>`;
  }

  function Help(c) {
    var u = S.user || {};
    var issues = ['Images or viewer', 'Can’t submit or sign', 'Can’t find a task', 'Something else'];
    var tasks = c.mine.concat(c.done);
    var send = function () {
      var text = 'Subject: [Reader] ' + S.hIssue + (S.hTask ? ' · ' + S.hTask : '') + '\nSite: ' + S.origin + '\nEmail: ' + ((S.user && S.user.email) || '') + '\n\n' + S.hMsg;
      try { navigator.clipboard.writeText(text).then(function () { flash('Request copied. Paste it into the support form.'); }, function () { flash('Copy blocked by the frame; select the text and copy it.'); }); } catch (e) {}
      window.open('https://support.flywheel.io/hc/en-us/requests/new', '_blank', 'noopener');
    };
    return html`<div class="stack">
      <${Typography} variant="p2">Goes to Flywheel Support. Your email, the site and the task are filled in for you.<//>
      <${PanelLayout} border="all" height="auto" style=${{ flex: 'none', maxWidth: '720px' }}
        footer=${html`<${Typography} variant="p4" color="light">Opens support.flywheel.io in a new tab and copies your request.<//><${Button} endIcon="open" onClick=${send}>Open Support Request...<//>`}>
        <div class="form">
          <${WrappedInput} title="Issue">
            <${ChipGroup}>${issues.map(function (x) { var on = S.hIssue === x; return html`<${Chip} key=${x + ':' + on} value=${x} title=${x} color="primary" selected=${on} onSelect=${function () { set({ hIssue: x }); }} />`; })}<//>
          <//>
          <${WrappedInput} title="Task">
            <${Select} name="htask" width=${280} value=${S.hTask || '__none'} aria-label="Task" onChange=${function (v) { set({ hTask: v === '__none' ? '' : v }); }}>
              <${SelectItem} value="__none">Not About One Task<//>
              ${tasks.map(function (t) { return html`<${SelectItem} key=${t.task_id} value=${t.task_id}>${t.task_id}<//>`; })}
            <//>
          <//>
          <${WrappedInput} title="What Happened" helperText="Don't include patient information.">
            <${TextArea} name="hmsg" rows=${4} fullWidth=${true} placeholder="e.g. series 3 never finishes loading" value=${S.hMsg} onChange=${function (v) { S.hMsg = v; render(); }} />
          <//>
          <${Typography} variant="p3">We send: ${u.email || 'your email'} · ${S.origin} · subject "[Reader] ${S.hIssue}${S.hTask ? ' · ' + S.hTask : ''}".<//>
        </div>
      <//>
    </div>`;
  }

  function Diag() {
    var sample = S.tasks[0] ? JSON.stringify(S.tasks[0], null, 2) : '(none)';
    // The raw row holds every field the server returned, so it renders only while the panel is open.
    return html`<${CollapseLayout} icon="code-text" iconColor="slate" title="Diagnostics" description=${VERSION + ' · calls made and one raw task (spike only)'} variant="card-background"
      open=${!!S.diagOpen} onOpenChange=${function (o) { set({ diagOpen: o }); }}>
      ${S.diagOpen ? html`<pre class="diag">${'Route: ' + (location.hash || '#/reads') + '\n' + S.log.join('\n')}</pre><pre class="diag">${sample}</pre>` : null}
    <//>`;
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sel) select(null); });
  // Refresh when the reader comes back from the viewer tab, when the frame regains focus, and every
  // 30 s while visible. The viewer runs in another tab on another origin, so there's no save/submit event
  // to listen to; this keeps the list current without a manual refresh.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshSoon('back on this tab'); });
  window.addEventListener('focus', function () { refreshSoon('focus'); });
  setInterval(function () { refreshSoon('every 30 s'); }, 30000);

  // Full screen until the shell has its own URL. Flywheel's overlay frame allows it ("allow=fullscreen");
  // browsers only enter full screen on a click, so the first click in the app does it. Esc leaves and is
  // respected; switching to the viewer tab drops full screen, and the next click restores it.
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fsEnter() { var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen; if (f && !fsOn()) { try { var r = f.call(el); if (r && r.catch) r.catch(function (e) { note('Full screen refused: ' + e.message); }); } catch (e) { note('Full screen refused: ' + e.message); } } }
  function fsExit() { var f = document.exitFullscreen || document.webkitExitFullscreen; if (f && fsOn()) f.call(document); }
  var fsCan = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  document.addEventListener('pointerdown', function (e) { if (fsCan && S.wantFull && !fsOn() && !(e.target.closest && e.target.closest('[data-value="fullscreen"]'))) fsEnter(); }, true);
  document.addEventListener('fullscreenchange', function () { if (!fsOn() && !document.hidden) { S.wantFull = false; note('Left full screen'); } render(); });
  render();
  connect();
})();
</script>
</body>
</html>
