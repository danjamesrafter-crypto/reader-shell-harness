<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Shell (live harness)</title>
<!--
  Reader Shell, live-data harness. Runs as a Flywheel extension app (Viewer type, matched to projects).
  All data comes through the Extension SDK's apiRequest proxy, so this page never sees a token.
  Requests ask only for blinded columns: no project, subject, session or file labels, no creator.
  Spike harness, not the product: the product mounts at /reader/ (see requirements doc RS-R1/R2).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Serif:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070D18;--panel:#0E1A2B;--line:#1E2F4A;--line2:#27395A;--fg:#E7EAF0;--mute:#A3ACBA;--dim:#7F8897;--accent:#2269E9;--warn:#F0B35E;--bad:#FF9B8A;--ok:#7FE0C0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter Tight",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5AA9F0;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:#C9D0DA}
h1{margin:0;font:400 30px/1.15 "Noto Serif",Georgia,serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:#34B8F5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.card[aria-pressed="true"]{border-color:var(--accent);background:#132544}
.card:disabled{opacity:.55;cursor:default}
.card b{font-size:24px;font-weight:500}
.card span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;color:var(--mute);padding:10px 0;border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:#fff;border-color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#0B1525;color:var(--fg);font:inherit;font-size:13px}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#0A1424}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #132238;vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#16253C;color:#C9D0DA}
.btn{height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--mute)}
.empty{padding:28px;text-align:center;color:var(--mute)}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px}
summary{cursor:pointer;color:#A9D2FA;font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 "IBM Plex Mono",monospace;color:#C9D0DA;margin:10px 0 0}
.banner{padding:12px 14px;border-radius:12px;border:1px solid rgba(240,179,94,.45);background:rgba(240,179,94,.08)}
.toast{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:10px;background:#162842;border:1px solid var(--line2)}

.shell{display:flex;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;flex:none;width:224px;display:flex;flex-direction:column;gap:6px;padding:16px 12px;border-right:1px solid var(--line);background:#0A1322;transition:width .15s}
.rail.min{width:68px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;justify-content:space-between}
.brand .nm{display:flex;flex-direction:column;line-height:1.15}
.brand .nm b{font-weight:600;font-size:16px}.brand .nm span{font-size:9.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.nav{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:9px;border:none;background:transparent;color:#C9D0DA;font-weight:500;text-align:left;width:100%}
.nav:hover{background:#13233A}
.nav[aria-current="page"]{background:#16304F;color:#fff}
.nav svg,.ib svg{width:20px;height:20px;flex:none}
.nav .ct{margin-left:auto;font-size:12px;padding:1px 8px;border-radius:999px;background:#1E2F4A;color:#C9D0DA}
.rail.min .brand{flex-direction:column;gap:10px;padding:2px 0 14px}
.rail.min .lbl,.rail.min .ct,.rail.min .nm,.rail.min .who{display:none}
.rail.min .nav{justify-content:center;padding:0}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:#C9D0DA;display:flex;align-items:center;justify-content:center;padding:0}
.rail [data-fs]{margin-top:auto}
.me{display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:999px;background:#1E2F4A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.who{display:flex;flex-direction:column;min-width:0;font-size:13px}.who span{font-size:11px;color:var(--mute)}
.main{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-size:15px;font-weight:600}
.stat b{font-size:30px;font-weight:500}.stat span{display:block;font:400 15px/1.3 "Noto Serif",Georgia,serif;color:#BDA6FF}
textarea.fld{height:auto;min-height:96px;padding:10px 12px;border-radius:12px;resize:vertical;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#C9D0DA;font-size:13px}
.chipb[aria-pressed="true"]{border-color:var(--accent);background:#16304F;color:#fff}
@media (max-width:720px){.rail{width:68px}.rail .lbl,.rail .ct,.rail .nm,.rail .who{display:none}.rail .nav{justify-content:center;padding:0}}

.idbtn{border:none;background:none;padding:0;color:#A9D2FA;font:500 13px "IBM Plex Mono",ui-monospace,monospace;text-decoration:underline;text-decoration-color:rgba(169,210,250,.35);text-underline-offset:3px}
.idbtn:hover{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.6);z-index:20;border:none;padding:0;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:21;background:var(--panel);border-left:1px solid var(--line);box-shadow:-24px 0 48px rgba(0,0,0,.45);overflow-y:auto;padding:64px 22px 22px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv div{display:flex;flex-direction:column;gap:2px}.kv span{font-size:12px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;gap:10px;align-items:baseline}.tl i{width:8px;height:8px;border-radius:99px;background:var(--accent);flex:none;transform:translateY(-1px)}
.hidden-note{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

.flt{display:flex;flex-direction:column;gap:4px}.flt label{font-size:12px;color:var(--mute)}
select.fld{padding-right:28px}
.pchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#C9D0DA;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:#16304F;color:#fff}
.pchip .n{color:var(--mute)}
.sorth{border:none;background:transparent;padding:4px 0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sorth:hover{color:var(--fg)}
.sorth[data-on="1"]{color:var(--fg)}
.sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
</style>
</head>

  function render() {

  function rail(c) {

    else if (S.sortMode === 'oldest') cmp = function (a, b) { return String(a.created).localeCompare(String(b.created)) || natural(a.task_id, b.task_id); };

  // Task details: only what the reader needs. Built from the list row (blinded columns), never from

    if (!t) return '';

    var p = Array.isArray(S.protocols) ? S.protocols.filter(function (x) { return (x._id || x.id) === t.protocol_id; })[0] : null;

  function queries() {
    return '<h1>Queries</h1><div class="box"><h3>Nothing to answer</h3><p class="muted" style="margin:0">Questions from the study team about your submitted reads will appear here. Queries are planned for late 2026 to early 2027; the 23.0 API has no queries endpoint yet, so this page is a placeholder in the live harness.</p></div>';
  }

      h += '<div class="tbl"><table><thead><tr><th>Task</th><th>Protocol</th><th>Completed</th><th>Time</th></tr></thead><tbody>' + c.done.map(function (t) {
        var e = t.transitions && t.transitions.completed, m = minutesOf(t);
        return '<tr><td><button class="idbtn" data-sel="' + esc(t._id || t.id) + '">' + esc(t.task_id) + '</button></td><td>' + esc(t.protocol_label) + '</td><td>' + (e ? new Date(e).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—') + '</td><td>' + (m != null ? m + ' min' : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    return h;
  }

  function loadProtocols() {
    if (S.protocols) return;
    S.protocols = 'loading';
    api('GET', '/api/protocols', { filter: 'task_type=reader' }).then(function (r) {
      S.protocols = Array.isArray(r) ? r : (r && (r.results || r.items || r.data)) || [];
      render();
    }, function () { S.protocols = []; render(); });
  }
  function resources(c) {
    loadProtocols();
    var h = '<h1>Study resources</h1><p class="muted" style="margin:0">The protocols behind your tasks. Only protocols you have tasks on are listed.</p>';
    if (S.protocols === 'loading' || !S.protocols) return h + '<p class="muted">Loading…</p>';
    var all = c.mine.concat(c.done, c.pool), used = {};
    all.forEach(function (t) { var k = t.protocol_id || t.protocol_label; used[k] = used[k] || { open: 0, done: 0 }; if (t.status === 'completed') used[k].done++; else used[k].open++; });
    var mineP = S.protocols.filter(function (p) { return used[p._id || p.id] || used[p.label]; });
    if (!mineP.length) return h + '<div class="box"><p class="muted" style="margin:0">No protocol details available.</p></div>';
    return h + '<div class="grid2">' + mineP.map(function (p) {
      var u = used[p._id || p.id] || used[p.label] || { open: 0, done: 0 };
      var es = p.esignature_config && p.esignature_config.required;
      return '<div class="box"><h3>' + esc(p.label) + ' <span class="muted" style="font-weight:400">v' + esc(p.version) + '</span></h3>' +
        '<div class="muted" style="font-size:13px">' + (es ? 'E-signature on submit' : 'No e-signature') + ' · ' + u.open + ' open, ' + u.done + ' done</div>' +
        '<p style="margin:0">' + (p.notes ? esc(p.notes) : '<span class="muted">No reader-facing summary on this protocol yet. A summary field (requirement RS-P1) would fill this card.</span>') + '</p></div>';
    }).join('') + '</div>';
  }

  function help(c) {
    var u = S.user || {};
    var issues = ['Images or viewer', 'Can’t submit or sign', 'Can’t find a task', 'Something else'];
    var h = '<h1>Get help</h1><p class="muted" style="margin:0">Goes to Flywheel Support. Your email, the site and the task are filled in for you.</p><div class="box" style="gap:14px">';
    h += '<div><div class="muted" style="font-size:13px;margin-bottom:6px">What’s going on?</div><div class="chips">' + issues.map(function (x) { return '<button class="chipb" data-issue="' + esc(x) + '" aria-pressed="' + (S.hIssue === x) + '">' + esc(x) + '</button>'; }).join('') + '</div></div>';
    h += '<div><label class="muted" for="htask" style="font-size:13px">Which task?</label><br><select class="fld" id="htask" style="margin-top:6px"><option value="">Not about one task</option>' + c.mine.concat(c.done).map(function (t) { return '<option' + (S.hTask === t.task_id ? ' selected' : '') + '>' + esc(t.task_id) + '</option>'; }).join('') + '</select></div>';
    h += '<div><label class="muted" for="hmsg" style="font-size:13px">What happened?</label><textarea class="fld" id="hmsg" style="margin-top:6px" placeholder="e.g. series 3 never finishes loading">' + esc(S.hMsg) + '</textarea></div>';
    h += '<div class="muted" style="font-size:13px">We send: ' + esc(u.email || 'your email') + ' · ' + esc(S.origin) + ' · subject “[Reader] ' + esc(S.hIssue) + (S.hTask ? ' · ' + esc(S.hTask) : '') + '”. Don’t include patient information.</div>';
    h += '<div class="bar"><button class="btn primary" data-support="1">Open support request</button><span class="muted" style="font-size:12px">Opens support.flywheel.io in a new tab and copies your request so you can paste it.</span></div></div>';
    return h;
  }

  function diag() {
    var sample = S.tasks[0] ? JSON.stringify(S.tasks[0], null, 2) : '(none)';
    return '<details><summary>Diagnostics for the spike: calls made and one raw task</summary><pre>Route: ' + esc(location.hash || '#/reads') + '\n' + esc(S.log.join('\n')) + '</pre><pre>' + esc(sample) + '</pre></details>';
  }

  function bind(list) {
    function all(sel, fn) { app.querySelectorAll(sel).forEach(fn); }
    all('[data-screen]', function (b) { b.onclick = function () { S.screen = b.getAttribute('data-screen'); render(); window.scrollTo(0, 0); }; });
    all('[data-fs]', function (b) { b.onclick = function () { if (fsOn()) { S.wantFull = false; fsExit(); } else { S.wantFull = true; fsEnter(); } }; });
    all('[data-rail]', function (b) { b.onclick = function () { S.rail = !S.rail; try { localStorage.setItem('readerShell.railCollapsed', S.rail ? '1' : '0'); } catch (e) {} render(); }; });
    all('[data-focus]', function (b) { b.onclick = function () { var k = b.getAttribute('data-focus'); S.focus = S.focus === k ? null : k; S.tab = 'mine'; render(); }; });
    all('[data-tab]', function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.focus = null; S.fProto = 'all'; render(); }; });
    all('[data-open]', function (b) { b.onclick = function () { var t = list[+b.getAttribute('data-open')]; var u = viewerUrl(t); note('open viewer ' + u); window.open(u, '_blank', 'noopener'); }; });
    all('[data-claim]', function (b) { b.onclick = function () { b.disabled = true; claim(list[+b.getAttribute('data-claim')]); }; });
    all('[data-issue]', function (b) { b.onclick = function () { S.hIssue = b.getAttribute('data-issue'); render(); }; });
    all('[data-sel]', function (b) { b.onclick = function () { S.sel = b.getAttribute('data-sel'); render(); var x = app.querySelector('.drawer .ib'); if (x) x.focus(); }; });
    all('[data-close]', function (b) { b.onclick = function () { S.sel = null; render(); }; });
    function selTask() { return S.tasks.filter(function (x) { return (x._id || x.id) === S.sel; })[0]; }
    var os = app.querySelector('[data-opensel]'); if (os) os.onclick = function () { var u = viewerUrl(selTask()); note('open viewer ' + u); window.open(u, '_blank', 'noopener'); };
    var cs = app.querySelector('[data-claimsel]'); if (cs) cs.onclick = function () { cs.disabled = true; var t = selTask(); S.sel = null; claim(t); };
    var ab = app.querySelector('[data-about]'); if (ab) ab.onclick = function () { S.sel = null; S.screen = 'resources'; render(); };
    var rp = app.querySelector('[data-report]'); if (rp) rp.onclick = function () { var t = selTask(); S.sel = null; S.screen = 'help'; S.hTask = t ? t.task_id : ''; render(); };
    function sel(id, key) { var e = document.getElementById(id); if (e) e.onchange = function () { S[key] = e.value; if (key === 'sortMode' && e.value !== 'column') S.sortKey = null; render(); }; }
    sel('fread', 'fRead'); sel('fprio', 'fPrio'); sel('fsort', 'sortMode');
    all('[data-proto]', function (b) { b.onclick = function () { S.fProto = b.getAttribute('data-proto'); render(); }; });
    all('[data-sort]', function (b) { b.onclick = function () { var k = b.getAttribute('data-sort'); if (S.sortMode === 'column' && S.sortKey === k) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; else { S.sortMode = 'column'; S.sortKey = k; S.sortDir = 'asc'; } render(); }; });
    var rs = app.querySelector('[data-reset]'); if (rs) rs.onclick = function () { S.q = ''; S.fRead = 'all'; S.fPrio = 'all'; S.fProto = 'all'; S.sortMode = 'queue'; S.sortKey = null; render(); };
    var c = app.querySelector('[data-clear]'); if (c) c.onclick = function () { S.focus = null; render(); };
    var r = app.querySelector('[data-reload]'); if (r) r.onclick = function () { load(); };
    var ht = document.getElementById('htask'); if (ht) ht.onchange = function () { S.hTask = ht.value; render(); };
    var hm = document.getElementById('hmsg'); if (hm) hm.oninput = function () { S.hMsg = hm.value; };
    var sp = app.querySelector('[data-support]'); if (sp) sp.onclick = function () {
      var text = 'Subject: [Reader] ' + S.hIssue + (S.hTask ? ' · ' + S.hTask : '') + '\nSite: ' + S.origin + '\nEmail: ' + ((S.user && S.user.email) || '') + '\n\n' + S.hMsg;
      try { navigator.clipboard.writeText(text).then(function () { flash('Request copied. Paste it into the support form.'); }, function () { flash('Copy blocked by the frame; select the text and copy it.'); }); } catch (e) {}
      window.open('https://support.flywheel.io/hc/en-us/requests/new', '_blank', 'noopener');
    };
    var q = document.getElementById('q');
    if (q) q.oninput = function () { S.q = q.value; var pos = q.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sel) { S.sel = null; render(); } });
  // Refresh when the reader comes back from the viewer tab
  // Refresh when the reader comes back from the viewer tab, when the frame regains focus, and every
  // 30 s while visible. The viewer runs in another tab on another origin, so there's no save/submit event
  // to listen to; this keeps the list current without a manual refresh.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshSoon('back on this tab'); });
  window.addEventListener('focus', function () { refreshSoon('focus'); });
  setInterval(function () { refreshSoon('every 30 s'); }, 30000);

  // Full screen until the shell has its own URL. Flywheel's overlay frame allows it ("allow=fullscreen");
  // browsers only enter full screen on a click, so the first click in the app does it. Esc leaves and is
  // respected; switching to the viewer tab drops full screen, and the next click restores it.
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fsEnter() { var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen; if (f && !fsOn()) { try { var r = f.call(el); if (r && r.catch) r.catch(function (e) { note('Full screen refused: ' + e.message); }); } catch (e) { note('Full screen refused: ' + e.message); } } }
  function fsExit() { var f = document.exitFullscreen || document.webkitExitFullscreen; if (f && fsOn()) f.call(document); }
  var fsCan = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  document.addEventListener('pointerdown', function (e) { if (fsCan && S.wantFull && !fsOn() && !(e.target.closest && e.target.closest('[data-fs]'))) fsEnter(); }, true);
  document.addEventListener('fullscreenchange', function () { if (!fsOn() && !document.hidden) { S.wantFull = false; note('Left full screen'); } render(); });
  connect();
})();
</script>
</body>
</html>
